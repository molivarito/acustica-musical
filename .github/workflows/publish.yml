name: Publicar sitio Quarto

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Render sitio
        working-directory: material
        run: quarto render

      - name: Render perfil canvas (páginas sin sidebar para los módulos de Canvas)
        working-directory: material
        run: |
          quarto render --profile canvas
          cp -r _render/canvas _render/site/canvas
          # El libro se publica UNA sola vez, en /libro/. El perfil canvas
          # arrastra el PDF como recurso heredado de _quarto.yml y el cp lo
          # dejaría otra vez en /canvas/libro/ (1,1 MB duplicados). Canvas
          # enlaza capítulos sueltos, nunca la portada, así que nada bajo
          # /canvas/ apunta a este archivo.
          rm -f _render/site/canvas/libro/LIBRO_CURSO.pdf

      - name: Filtrar material solo-profesor del deploy (patrón SyS)
        run: |
          # las slides se renderizan junto a su clase (para el render
          # local del profesor), pero NO se publican en el sitio
          find material/_render/site -name 'slides_s*.html' -delete
          echo "slides restantes en material/_render/site: $(find material/_render/site -name 'slides_s*.html' | wc -l)"
          # el índice del buscador se construye ANTES de este borrado y
          # arrastra el texto de las slides (y apuntaría a 404): podar
          # sus entradas de todo search.json del deploy
          python3 - <<'EOF'
          import json, pathlib
          for p in pathlib.Path('material/_render/site').rglob('search.json'):
              datos = json.loads(p.read_text())
              filtrado = [e for e in datos if 'slides_s' not in e.get('href', '')]
              p.write_text(json.dumps(filtrado, ensure_ascii=False))
              print(f"{p}: {len(datos) - len(filtrado)} entradas de slides podadas")
          EOF
          # fotos de archivo con personas identificables: SOLO para
          # proyectar en clase, jamás al sitio público
          rm -rf material/_render/site/assets/proyectos_antiguos
          rm -rf material/_render/site/canvas/assets/proyectos_antiguos

      - name: Auditar fugas de material solo-profesor (patrón SyS)
        run: python3 canvas/auditar_sitio.py --sin-slides material/_render/site

      - name: Verificar consistencia del diseño (DATOS_CURSO.yml)
        run: pip install pyyaml -q && python3 verificar_consistencia.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: material/_render/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
