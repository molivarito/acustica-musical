<!--
  MEDIDOR DE DESBORDE DE LÁMINAS (2026-08-29)
  ===========================================
  Las láminas de reveal miden 1050×700 px: lo que pase de 700 se corta al
  proyectar, en silencio. Nadie lo había medido nunca; el barrido del
  2026-08-29 encontró 19 láminas cortadas en 11 de los 15 mazos.

  CÓMO USARLO
    1. cd material && conda run -n base quarto render      (o solo los mazos tocados)
    2. cp ediciones/2026-2/medir_desborde_laminas.html material/_render/site/__medidor.html
    3. cd material/_render/site && python3 -m http.server 8799 --bind 127.0.0.1
    4. abrir http://127.0.0.1:8799/__medidor.html y en la consola:
         await window.__cola(['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15'])
         window.__acum
    5. borrar el __medidor.html del render al terminar.

  CÓMO FUNCIONA, Y POR QUÉ ASÍ
  - Clona cada lámina en un contenedor fuera de pantalla DENTRO de .reveal
    .slides, para que herede el CSS del tema. NO navega con Reveal.slide():
    navegar hace que reveal precargue los iframes de las demos vecinas y el
    navegador se cuelga (pasó, y costó caro).
  - Divide por Reveal.getScale(). El clon vive dentro de .slides, que lleva
    la transformación de escala: sin dividir, las medidas salen escaladas y
    parecen consistentes cuando no lo son. Este error ya se cometió una vez.
  - Rompe-caché en el src del iframe: sin él, tras re-renderizar se miden los
    HTML viejos y parece que el arreglo no hizo nada. También pasó.
  - Sobreestima ~1–3 % frente a medir navegando (validado en 4 láminas):
    tratar 700–760 como "al límite, verificar" y >760 como desborde.
-->
<!doctype html><meta charset=utf-8><title>medidor de desborde</title>
<style>body{font-family:monospace;margin:8px}iframe#marco{width:1050px;height:400px;border:1px solid #ccc}</style>
<h3>medidor (clones, sin navegar)</h3><pre id=log></pre>
<iframe id=marco></iframe>
<script>
// Mide SIN navegar: clona cada lámina en un contenedor fuera de pantalla dentro
// de .reveal .slides (para que herede el CSS del tema). No llama a
// Reveal.slide(), así que reveal nunca precarga los iframes de las demos —
// que es lo que colgaba al medidor anterior.
// El clon sobreestima de forma muy estable: real ≈ 0,577 × clon (calibrado
// contra 10 mediciones reales de s04/s11/s12, rango 0,557–0,591).
window.__prog = '';
const log = m => { window.__prog = m; document.getElementById('log').textContent = m; };
window.medirMazo = function (n) {
  return new Promise((resolve) => {
    const marco = document.getElementById('marco');
    marco.onload = async () => {
      const d = marco.contentDocument, w = marco.contentWindow;
      const esperar = ms => new Promise(r => setTimeout(r, ms));
      let i = 0; while (!w.Reveal && i++ < 40) await esperar(150);
      await esperar(400);
      // desarmar demos para que nada se cargue
      d.querySelectorAll('[data-background-iframe]').forEach(el => {
        el.setAttribute('data-tenia-iframe','1');
        el.removeAttribute('data-background-iframe');
      });
      d.querySelectorAll('iframe').forEach(f => f.remove());
      const slides = d.querySelector('.reveal .slides');
      const cont = d.createElement('div');
      cont.style.cssText = 'position:absolute; left:-99999px; top:0; width:1050px; visibility:hidden;';
      slides.appendChild(cont);
      const secs = [...slides.querySelectorAll(':scope > section')].filter(s => s !== cont);
      const cand = [];
      for (let k = 0; k < secs.length; k++) {
        if (secs[k].hasAttribute('data-tenia-iframe')) continue;
        log(`s${n}: ${k+1}/${secs.length}`);
        const c = secs[k].cloneNode(true);
        c.querySelectorAll('aside.notes, .notes').forEach(x => x.remove());
        c.querySelectorAll('.fragment').forEach(f => f.classList.add('visible'));
        c.classList.add('present');
        c.style.cssText = 'display:block; position:static; width:1050px; height:auto; transform:none; opacity:1; visibility:visible;';
        cont.appendChild(c);
        // El clon vive dentro de .slides, que lleva la transformación de escala
        // de reveal: hay que dividir por ella para obtener píxeles de lámina.
        const esc = (w.Reveal && w.Reveal.getScale && w.Reveal.getScale()) || 1;
        const clon = Math.round(c.getBoundingClientRect().height / esc);
        cont.removeChild(c);
        const t = c.querySelector('h1,h2,h3');
        cand.push({ lamina: k+1, titulo: t ? t.textContent.trim().slice(0,42) : '(portada)',
                    clon });
      }
      cont.remove();
      cand.sort((a,b)=>b.clon-a.clon); resolve({ sesion: n, total: secs.length, escala: (w.Reveal&&w.Reveal.getScale&&w.Reveal.getScale())||1, top3: cand.slice(0,3), desbordan: cand.filter(x=>x.clon>700) });
    };
    marco.src = `/curso/sesion-${n}/slides_s${n}.html?cb=${Date.now()}_${Math.random()}`;
  });
};
window.__cola = async function (lista) {
  window.__acum = []; window.__fin = false;
  for (const n of lista) window.__acum.push(await window.medirMazo(n));
  window.__fin = true; log('COLA COMPLETA');
};
</script>
